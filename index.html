<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلای برزنجه</title>

<style>

*{
box-sizing:border-box;
font-family:tahoma,Arial,sans-serif;
}

body{
margin:0;
background:#f7f7f7;
color:#111;
}


/* هدر */

.header{
background:#050505;
padding:35px 15px;
text-align:center;
border-bottom:2px solid #d4af37;
}

.logo{
font-size:34px;
font-weight:bold;
color:#d4af37;
text-shadow:0 0 15px #d4af37;
}

.subtitle{
color:white;
margin-top:10px;
}


/* کادر قیمت */

.market{
margin:20px auto;
max-width:1000px;
background:rgba(255,255,255,0.7);
backdrop-filter:blur(15px);
border-radius:30px;
padding:25px;
box-shadow:
0 20px 40px rgba(0,0,0,.15);
}


.market h2{
text-align:center;
margin-bottom:25px;
}


/* سه کارت قیمت */

.prices{
display:flex;
gap:12px;
}


.price-card{

flex:1;

background:
linear-gradient(
145deg,
#ffffff,
#eeeeee
);

border-radius:25px;

padding:15px 8px;

text-align:center;

box-shadow:
8px 8px 20px #d0d0d0,
-5px -5px 15px white;

transition:.3s;

}


.price-card:hover{
transform:translateY(-5px);
}


.icon{
font-size:35px;
}


.name{
font-size:15px;
font-weight:bold;
margin:10px 0;
}


.value{

font-size:18px;

font-weight:bold;

color:#c9a227;

}


.change{
margin-top:8px;
font-weight:bold;
}


.green{
color:green;
}


.red{
color:red;
}


/* نمودار */

.chart{

margin:20px;

background:#050505;

color:white;

border-radius:30px;

padding:25px;

text-align:center;

}


.chart button{

background:#d4af37;

border:0;

padding:10px 15px;

border-radius:15px;

margin:5px;

}


/* خرید فروش */

.buy{

display:flex;

gap:15px;

margin:20px;

}


.box{

flex:1;

background:#050505;

color:white;

padding:25px;

border-radius:25px;

text-align:center;

}


.box button{

background:#d4af37;

border:0;

padding:12px;

border-radius:15px;

width:100%;

}


/* موبایل */

@media(max-width:600px){

.prices{

flex-direction:row;

}

.price-card{

padding:12px 5px;

}

.icon{

font-size:25px;

}

.value{

font-size:14px;

}

.name{

font-size:12px;

}

}

</style>

</head>


<body>


<div class="header">

<div class="logo">
✦ طلای برزنجه ✦
</div>

<div class="subtitle">
خرید و فروش امن آبشده طلا
</div>

</div>



<div class="market">

<h2>
📊 قیمت لحظه‌ای بازار
</h2>


<div class="prices">


<div class="price-card">

<div class="icon">🪙</div>

<div class="name">
آبشده
</div>

<div class="value">
18,500,000
</div>

<div class="change green">
▲ +1.2%
</div>

</div>



<div class="price-card">

<div class="icon">🌐</div>

<div class="name">
اونس جهانی
</div>

<div class="value">
4050 $
</div>

<div class="change red">
▼ -0.3%
</div>

</div>



<div class="price-card">

<div class="icon">💵</div>

<div class="name">
تتر
</div>

<div class="value">
98,500
</div>

<div class="change green">
▲ +0.8%
</div>

</div>


</div>

</div>



<div class="chart">

<h2>
📈 نمودار بازار
</h2>

<button>آبشده</button>
<button>اونس</button>
<button>تتر</button>

<p>
کندل چارت اینجا اضافه می‌شود
</p>

</div>



<div class="buy">

<div class="box">

<h3>
خرید آبشده
</h3>

<p>
قیمت خرید
---
</p>

<button>
ثبت سفارش
</button>

</div>


<div class="box">

<h3>
فروش آبشده
</h3>

<p>
قیمت فروش
---
</p>

<button>
ثبت سفارش
</button>

</div>

</div>


</body>
</html>
