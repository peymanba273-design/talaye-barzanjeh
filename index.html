<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلای برزنجه | خرید و فروش آبشده</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Vazirmatn, Tahoma;
background:#080808;
color:white;
}

.header{
padding:35px 20px;
text-align:center;
background:linear-gradient(135deg,#000,#222);
border-bottom:2px solid #d4af37;
}

.logo{
font-size:38px;
font-weight:900;
color:#d4af37;
}

.subtitle{
color:#ddd;
font-size:16px;
}


.container{
padding:20px;
}


.card{
background:#151515;
border:1px solid #d4af37;
border-radius:18px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 15px #000;
}


.title{
color:#d4af37;
font-size:22px;
font-weight:bold;
}


.price{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid #333;
font-size:18px;
}


.number{
color:#d4af37;
font-weight:bold;
}


.buttons{
display:flex;
gap:15px;
}


button{
flex:1;
padding:15px;
border:0;
border-radius:12px;
background:#d4af37;
font-size:18px;
font-weight:bold;
cursor:pointer;
}


.footer{
text-align:center;
padding:20px;
color:#aaa;
}

</style>

</head>


<body>


<div class="header">

<div class="logo">
✦ طلای برزنجه ✦
</div>

<div class="subtitle">
خرید و فروش امن آبشده طلا
</div>

</div>



<div class="container">


<div class="card">

<div class="title">
قیمت لحظه‌ای بازار
</div>


<div class="price">
<span>آبشده</span>
<span class="number">در حال بروزرسانی</span>
</div>


<div class="price">
<span>اونس جهانی</span>
<span class="number">در حال بروزرسانی</span>
</div>


<div class="price">
<span>تتر</span>
<span class="number">در حال بروزرسانی</span>
</div>


</div>



<div class="card">

<div class="title">
ثبت سفارش
</div>

<br>

<div class="buttons">

<button>
خرید آبشده
</button>

<button>
فروش آبشده
</button>

</div>

</div>




<div class="card">

<div class="title">
ساعات فعالیت
</div>

<p>
هر روز ۱۰ صبح تا ۹ شب
</p>

<p>
برای ارسال رسید از واتساپ استفاده کنید.
</p>

</div>


</div>



<div class="footer">
طلای برزنجه © 2026
</div>


</body>
</html>
