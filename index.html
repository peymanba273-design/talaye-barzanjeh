<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلای برزنجه</title>

<style>

*{
box-sizing:border-box;
font-family:tahoma,Arial;
}

body{
margin:0;
background:#f5f5f5;
color:#111;
}


/* header */

.header{
background:#050505;
color:white;
padding:35px 20px;
text-align:center;
border-bottom:3px solid #d4af37;
}

.logo{
font-size:35px;
font-weight:bold;
color:#d4af37;
}

.subtitle{
margin-top:10px;
color:white;
}


/* market */

.market{
margin:20px;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px #ccc;
}


.title{
text-align:center;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}


/* price cards */

.prices{
display:flex;
gap:15px;
justify-content:center;
}


.price{
flex:1;
background:#fff;
border-radius:20px;
padding:20px;
text-align:center;
box-shadow:0 8px 20px #ddd;
border:1px solid #eee;
}


.icon{
font-size:40px;
}


.name{
font-weight:bold;
margin:10px;
}


.number{
font-size:20px;
font-weight:bold;
color:#d4af37;
}


.up{
color:green;
}

.down{
color:red;
}


/* chart */

.chart{
margin:20px;
background:#050505;
color:white;
border-radius:25px;
padding:25px;
text-align:center;
}


.tabs button{
background:#d4af37;
border:0;
padding:10px 20px;
border-radius:15px;
margin:5px;
}


/* calculator */

.card{
margin:20px;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px #ccc;
}


input{
width:100%;
padding:15px;
border-radius:15px;
border:1px solid #ddd;
margin-top:10px;
}


button.main{
background:#d4af37;
border:0;
padding:15px;
border-radius:15px;
width:100%;
font-size:18px;
margin-top:15px;
}


/* buy sell */

.buySell{
display:flex;
gap:15px;
margin:20px;
}


.box{
flex:1;
background:#050505;
color:white;
padding:25px;
border-radius:25px;
text-align:center;
}


.footer{
background:#050505;
color:white;
padding:20px;
text-align:center;
}


@media(max-width:700px){

.prices,
.buySell{
flex-direction:column;
}

}

</style>

</head>


<body>


<div class="header">

<div class="logo">
✦ طلای برزنجه ✦
</div>

<div class="subtitle">
خرید و فروش امن آبشده طلا
</div>

</div>



<div class="market">

<div class="title">
📊 قیمت لحظه‌ای بازار
</div>


<div class="prices">


<div class="price">

<div class="icon">🪙</div>

<div class="name">
آبشده
</div>

<div class="number">
18,500,000
</div>

<div class="up">
▲ +1.2%
</div>

</div>



<div class="price">

<div class="icon">🌐</div>

<div class="name">
اونس جهانی
</div>

<div class="number">
4050 $
</div>

<div class="down">
▼ -0.3%
</div>

</div>



<div class="price">

<div class="icon">💵</div>

<div class="name">
تتر
</div>

<div class="number">
98,500
</div>

<div class="up">
▲ +0.8%
</div>

</div>


</div>

</div>



<div class="chart">

<h2>
📈 نمودار بازار
</h2>


<div class="tabs">

<button>آبشده</button>
<button>اونس</button>
<button>تتر</button>

</div>


<p>
کندل چارت اینجا قرار می‌گیرد
</p>


</div>




<div class="card">

<h2>
🧮 ماشین حساب طلا
</h2>


<input placeholder="چند گرم می‌خواهید؟">


<button class="main">
محاسبه قیمت
</button>


</div>




<div class="buySell">


<div class="box">

<h2>
خرید آبشده
</h2>

<p>
قیمت خرید:
---</p>

<button class="main">
ثبت سفارش
</button>

</div>



<div class="box">

<h2>
فروش آبشده
</h2>

<p>
قیمت فروش:
---</p>

<button class="main">
ثبت سفارش
</button>

</div>


</div>




<div class="footer">

طلای برزنجه © 2026

</div>


</body>
</html>
